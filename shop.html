<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#14402A">
<title>Boutique | TONDRAAGA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--green:#1F5B3A;--deep:#14402A;--ochre:#F2A83B;--orange:#D9480F;--cream:#FBF3E4;--ink:#172033;--muted:#667085;--line:#E1E7E2;--soft:#F1F6F2}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',Arial,sans-serif;background:var(--cream);color:var(--ink);padding-bottom:86px}
a{text-decoration:none;color:inherit;-webkit-tap-highlight-color:transparent}
button,input{font:inherit}
.header{height:65px;background:#fff;border-bottom:1px solid rgba(20,64,42,.1);position:sticky;top:0;z-index:20;display:flex;align-items:center}
.header-inner{width:100%;max-width:900px;margin:auto;padding:0 15px;display:flex;align-items:center;gap:12px}
.back{width:42px;height:42px;border:0;border-radius:13px;background:var(--soft);color:var(--green);font-size:24px;display:grid;place-items:center}
.header-title{font-weight:800;color:var(--deep);font-size:17px;flex:1}
.cart{width:42px;height:42px;border-radius:13px;background:var(--soft);color:var(--green);display:grid;place-items:center;font-size:20px}
.page{max-width:900px;margin:auto;padding:16px}
.shop-hero{background:#fff;border:1px solid var(--line);border-radius:23px;overflow:hidden;box-shadow:0 8px 25px rgba(20,64,42,.06)}
.cover{height:170px;background:linear-gradient(120deg,#DDEDE2,#BBD6C4);position:relative}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(10,40,24,.25),transparent 65%)}
.identity{padding:0 18px 18px;display:flex;align-items:flex-end;gap:13px;position:relative}
.avatar{width:82px;height:82px;margin-top:-37px;border:4px solid white;border-radius:22px;background:#E8F1EA;box-shadow:0 4px 15px rgba(0,0,0,.12);overflow:hidden;display:grid;place-items:center;color:var(--green);font-size:26px;font-weight:800;flex-shrink:0;z-index:1}
.avatar img{width:100%;height:100%;object-fit:cover}
.shop-name{min-width:0;padding:8px 0 3px}
.shop-name h1{font-size:23px;line-height:1.15;color:var(--deep);font-weight:800;overflow-wrap:anywhere}
.city{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:13px;margin-top:7px}
.summary{display:flex;gap:9px;flex-wrap:wrap;padding:0 18px 18px}
.pill{display:flex;align-items:center;gap:6px;background:var(--soft);color:#355C43;border-radius:11px;padding:8px 11px;font-size:12px;font-weight:700}
.pill.rating{background:#FFF4DE;color:#87570C}
.intro{padding:0 18px 18px;color:var(--muted);font-size:13px;line-height:1.55}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:24px 2px 13px}
.section-head h2{font-size:20px;color:var(--deep);font-weight:800}
.section-head p{font-size:12px;color:var(--muted);margin-top:4px}
.count{font-size:12px;color:var(--muted);font-weight:700;white-space:nowrap}
.products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.product{background:#fff;border:1px solid rgba(20,64,42,.1);border-radius:18px;overflow:hidden;box-shadow:0 6px 18px rgba(20,64,42,.055);display:flex;flex-direction:column;min-width:0}
.product-image{height:clamp(145px,42vw,190px);background:linear-gradient(135deg,#EEF5EF,#DDEBE0);overflow:hidden}
.product-image img{width:100%;height:100%;object-fit:cover;display:block}
.product-info{padding:12px;display:flex;flex-direction:column;flex:1}
.product-name{font-size:14px;font-weight:700;line-height:1.35;color:var(--deep);min-height:38px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.category{font-size:11px;color:var(--muted);margin-top:5px}
.price{font-size:17px;font-weight:800;color:var(--green);margin-top:8px}
.detail{margin-top:12px;min-height:43px;border-radius:12px;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;font-weight:800;box-shadow:0 4px 10px rgba(20,64,42,.15)}
.detail:active{background:var(--deep);transform:scale(.985)}
.state{grid-column:1/-1;background:#fff;border:1px dashed #C7D5CB;border-radius:18px;padding:30px 18px;text-align:center}
.state strong{color:var(--deep);font-size:16px}
.state p{color:var(--muted);font-size:13px;line-height:1.55;margin-top:7px}
.retry{margin-top:13px;border:0;border-radius:11px;padding:10px 15px;background:var(--green);color:white;font-weight:700}
.bottom{position:fixed;bottom:0;left:0;right:0;height:70px;padding-bottom:env(safe-area-inset-bottom);background:#fff;border-top:1px solid rgba(20,64,42,.12);display:grid;grid-template-columns:repeat(3,1fr);z-index:20}
.nav{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#778078;font-size:11px;font-weight:700}
.nav.active{color:var(--green)}
@media(min-width:620px){.page{padding:22px}.cover{height:220px}.products{grid-template-columns:repeat(3,minmax(0,1fr));gap:17px}.product-image{height:190px}.product-info{padding:14px}.product-name{font-size:15px}.price{font-size:19px}}
@media(min-width:850px){.products{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style>
</head>
<body>
<header class="header"><div class="header-inner">
  <button class="back" onclick="history.back()" aria-label="Retour">‹</button>
  <div class="header-title">Boutique</div>
  <a class="cart" href="cart.html" aria-label="Panier">🛒</a>
</div></header>

<main class="page">
  <section class="shop-hero" id="shopHero">
    <div class="state"><strong>Chargement de la boutique…</strong><p>Nous récupérons ses informations.</p></div>
  </section>
  <section>
    <div class="section-head">
      <div><h2>Les produits de la boutique</h2><p>Découvrez les articles proposés par ce vendeur.</p></div>
      <span class="count" id="productCount">—</span>
    </div>
    <div class="products" id="products">
      <div class="state"><strong>Chargement des produits…</strong></div>
    </div>
  </section>
</main>

<nav class="bottom">
  <a class="nav active" href="marketplace.html"><span>⌂</span><span>Accueil</span></a>
  <a class="nav" href="cart.html"><span>🛒</span><span>Panier</span></a>
  <a class="nav" href="network.html"><span>♧</span><span>Réseau</span></a>
</nav>

<script>
const API="https://mzcwonizgrdzxikqeagu.supabase.co/functions/v1/tondraaga-public";
const shopId=new URLSearchParams(location.search).get("id");
const hero=document.getElementById("shopHero");
const productsBox=document.getElementById("products");

function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function money(v){return Number(v||0).toLocaleString("fr-FR")+" FCFA";}
function initials(v){return String(v||"T").trim().split(/\s+/).slice(0,2).map(x=>x[0]||"").join("").toUpperCase();}
function state(title,message,retry=false){return `<div class="state"><strong>${esc(title)}</strong><p>${esc(message)}</p>${retry?'<button class="retry" onclick="loadShop()">Réessayer</button>':""}</div>`;}

async function request(payload){
  const res=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
  const data=await res.json().catch(()=>({}));
  if(!res.ok||data.success!==true)throw new Error(data.error||data.message||"Impossible de charger les informations.");
  return data;
}
function renderShop(shop){
  const cover=shop.cover_image_url?`<img src="${esc(shop.cover_image_url)}" alt="Couverture de la boutique">`:"";
  const avatar=shop.profile_image_url?`<img src="${esc(shop.profile_image_url)}" alt="Logo de la boutique">`:esc(initials(shop.shop_name));
  const rating=Number(shop.rating_count)>0?`★ ${Number(shop.average_rating).toFixed(1)}/5 · ${Number(shop.rating_count)} avis`:"★ Nouvelle boutique";
  hero.innerHTML=`
    <div class="cover">${cover}</div>
    <div class="identity">
      <div class="avatar">${avatar}</div>
      <div class="shop-name"><h1>${esc(shop.shop_name||"Boutique TONDRAAGA")}</h1>
        <div class="city">⌖ ${esc(shop.city||"Ville non renseignée")}</div>
      </div>
    </div>
    <div class="summary">
      <span class="pill">${Number(shop.product_count)||0} produit${Number(shop.product_count)===1?"":"s"}</span>
      <span class="pill rating">${rating}</span>
    </div>
    <p class="intro">Bienvenue dans la boutique ${esc(shop.shop_name||"TONDRAAGA")}. Retrouvez ici tous ses produits publiés.</p>`;
  document.title=(shop.shop_name||"Boutique")+" | TONDRAAGA";
}
function renderProducts(products){
  document.getElementById("productCount").textContent=products.length+" article"+(products.length===1?"":"s");
  if(!products.length){productsBox.innerHTML=state("Aucun produit disponible","Cette boutique n'a pas encore de produit publié.");return;}
  productsBox.innerHTML=products.map(p=>{
    const image=p.image_url?`<img src="${esc(p.image_url)}" alt="${esc(p.name)}" loading="lazy">`:"";
    return `<article class="product">
      <div class="product-image">${image}</div>
      <div class="product-info">
        <div class="product-name">${esc(p.name||"Produit")}</div>
        ${p.category?`<div class="category">${esc(p.category)}</div>`:""}
        <div class="price">${money(p.price_xof??p.price)}</div>
        <a class="detail" href="product.html?id=${encodeURIComponent(p.id)}">Voir les détails <span>›</span></a>
      </div>
    </article>`;
  }).join("");
}
async function loadShop(){
  if(!shopId){hero.innerHTML=state("Boutique introuvable","Aucun identifiant de boutique n'a été fourni.");productsBox.innerHTML="";return;}
  try{
    const data=await request({action:"public-shop-detail",shop_id:shopId,page:1,limit:40});
    renderShop(data.shop);
    renderProducts(Array.isArray(data.products)?data.products:[]);
  }catch(e){
    hero.innerHTML=state("Chargement impossible",e.message||"Une erreur est survenue.",true);
    productsBox.innerHTML="";
    document.getElementById("productCount").textContent="—";
  }
}
loadShop();
</script>
</body>
</html>
